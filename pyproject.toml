[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    dataset
  | mlruns
  | saved_models
  | registry
  | checkpoints
  | logs
)/
'''
force-exclude = '''
/(
    dataset
  | mlruns
  | saved_models
  | registry
  | checkpoints
  | logs
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "dataset",
    "mlruns",
    "saved_models",
    "registry",
    "checkpoints",
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "B008", "BLE001"]



