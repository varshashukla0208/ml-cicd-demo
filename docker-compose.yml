

services:

  image-classification-api:

    container_name: image-classification-api

    build:
      context: .
      dockerfile: Dockerfile

    image: image-classification-api:latest

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./checkpoints:/app/checkpoints:ro

    working_dir: /app

    command:
      [
        "uvicorn",
        "api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 20s

networks:

  default:
    name: ml-network