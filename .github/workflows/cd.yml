name: CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the remote server after publishing the image"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/image-classification-api
  CONTAINER_NAME: image-classification-api
  CONTAINER_PORT: "8000"

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lint
        run: |
          ruff check .

      - name: Run Tests
        run: |
          pytest -q

      - name: Run Smoke Training
        run: |
          python -m training.train --config configs/smoke_train.yaml

      - name: Register Smoke Model
        run: |
          python -m registry.model_registry --best-run --artifact-path checkpoints/smoke_model.pth --alias smoke

      - name: Verify Registered Smoke Model
        run: |
          python -c "from registry import ModelRegistry; r=ModelRegistry(); v=r.get_version_by_alias('smoke'); print(v.name, v.version, v.run_id, v.source)"

  publish:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build And Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.event_name == 'push' || inputs.deploy == 'true' }}

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_CHECKPOINT_DIR: ${{ secrets.DEPLOY_CHECKPOINT_DIR }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Stop If Deploy Secrets Are Not Configured
        if: env.DEPLOY_HOST == '' || env.DEPLOY_USER == '' || env.DEPLOY_SSH_KEY == ''
        run: |
          echo "Deployment skipped. Configure DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY repository secrets to enable remote CD."

      - name: Deploy Container Over SSH
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: IMAGE_NAME,CONTAINER_NAME,CONTAINER_PORT,DEPLOY_PORT,DEPLOY_CHECKPOINT_DIR,GHCR_TOKEN
          script: |
            set -e

            IMAGE="${IMAGE_NAME}:latest"
            HOST_PORT="${DEPLOY_PORT:-8000}"
            CHECKPOINT_DIR="${DEPLOY_CHECKPOINT_DIR:-$HOME/image-classification-api/checkpoints}"

            mkdir -p "$CHECKPOINT_DIR"

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            docker pull "$IMAGE"
            docker rm -f "$CONTAINER_NAME" || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              -e PYTHONUNBUFFERED=1 \
              -v "$CHECKPOINT_DIR:/app/checkpoints:ro" \
              "$IMAGE"

            sleep 10
            curl --fail "http://localhost:$HOST_PORT/health"
